name: Validate Learning Journey

on:
  push:
  pull_request:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install starter lab dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install ipykernel
      - name: Validate notebook format and run the two starter labs
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Verify README tracking markers
        run: python scripts/journey.py refresh
